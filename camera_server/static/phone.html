<!DOCTYPE html>
<html>
<head>
  <title>Camera Source</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    body { margin:0; background:#000; overflow:hidden; font-family:sans-serif; }
    #video { width:100%; height:100vh; object-fit:cover; }
    #video.mirrored { transform: scaleX(-1); }
    #overlay {
      position:fixed; top:0; left:0; right:0; padding:10px;
      background:rgba(0,0,0,0.5); color:#0f0; font-size:14px; z-index:10;
    }
    #controls {
      position:fixed; bottom:0; left:0; right:0; padding:12px;
      background:rgba(0,0,0,0.6); display:flex; gap:10px; align-items:center; z-index:10;
    }
    button { padding:10px 16px; font-size:14px; border:none; border-radius:6px; background:#333; color:#fff; }
    #startBtn {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      padding:20px 30px; font-size:18px; z-index:20; background:#0a84ff; border-radius:10px;
    }
    input[type="range"] { flex:1; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="overlay">status: <span id="status">not started</span> | fps: <span id="fpsCounter">0</span></div>
  <button id="startBtn">Tap to Start Camera</button>
  <div id="controls" style="display:none;">
    <button id="flipBtn">Flip</button>
    <label style="color:#fff; font-size:12px;">Zoom</label>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
  </div>

  <script>
    const SOURCE_ID = "cam1";
    let facingMode = "environment";
    let stream = null;
    let ws = null;
    let track = null;
    let frameCount = 0;
    let loopId = 0;          // incremented every time we (re)start — old loops check this and self-terminate

    const video = document.getElementById("video");
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const fpsEl = document.getElementById("fpsCounter");

    setInterval(() => { fpsEl.textContent = frameCount; frameCount = 0; }, 1000);

    function connectWS() {
      if (ws) { ws.onclose = null; ws.close(); }   // explicitly close any previous socket, no dangling connections
      const wsUrl = `wss://${location.host}/ws/publish/${SOURCE_ID}`;
      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => statusEl.textContent = "connected";
      ws.onclose = () => { statusEl.textContent = "disconnected — retrying..."; setTimeout(connectWS, 1500); };
      ws.onerror = () => statusEl.textContent = "error";
    }

    async function startCamera() {
      const myLoopId = ++loopId;   // this call "owns" this generation of the loop

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        track = stream.getVideoTracks()[0];
        video.classList.toggle("mirrored", facingMode === "user");  // mirror only the front camera

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          document.getElementById("startBtn").style.display = "none";
          document.getElementById("controls").style.display = "flex";
          connectWS();
          sendLoop(myLoopId);
        };
      } catch (err) {
        statusEl.textContent = "camera error: " + err.message;
      }
    }

    function sendLoop(myLoopId) {
      if (myLoopId !== loopId) return;   // a newer generation has started — this one quietly stops

      if (ws && ws.readyState === WebSocket.OPEN && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (blob && myLoopId === loopId) {
            blob.arrayBuffer().then(buf => { ws.send(buf); frameCount++; });
          }
        }, "image/jpeg", 0.8);
      }
      setTimeout(() => sendLoop(myLoopId), 66);
    }

    document.getElementById("startBtn").onclick = startCamera;

    document.getElementById("flipBtn").onclick = async () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      stream.getTracks().forEach(t => t.stop());
      await startCamera();   // bumps loopId — old sendLoop chain sees the mismatch and exits cleanly
    };

    document.getElementById("zoomSlider").oninput = async (e) => {
      const zoomValue = parseFloat(e.target.value);
      const capabilities = track.getCapabilities();
      if (capabilities.zoom) {
        await track.applyConstraints({ advanced: [{ zoom: zoomValue }] });
      } else {
        statusEl.textContent = "zoom not supported on this camera/browser";
      }
    };
  </script>
</body>
</html>
